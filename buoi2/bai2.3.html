<!doctype html>
<html lang="en" data-bs-theme="light">
    <head>
        <title>Title</title>
        <!-- Required meta tags -->
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- Bootstrap CSS v5.3.8 -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />
    </head>
    <style>
        .khung {
            border: 2px solid #333;
            padding: 15px;
            margin-bottom: 15px;
            min-height: 110px;
        }
        .anh {
            width: 80px;
            height: 80px;
        }
    </style>
    <body>
        <header>
            <!-- place navbar here -->
        </header>
        <main>
            <div class="container mt-4">
                <h5>Left alignment (This is default)</h5>
                <div class="khung">
                    <img src="D:\file web image\image.png" class="anh" alt="anh1">
                </div>
                <h5>Center alignment using text alignment classes</h5>
                <div class="khung text-center">
                    <img src="D:\file web image\image.png" class="anh" alt="anh2">
                </div>
                <h5>Right alignment using text alignment classes</h5>
                <div class="khung text-end">
                    <img src="D:\file web image\image.png" class="anh" alt="anh3">
                </div>
                <h5>Horizontal alignment using float classes</h5>
                <div class="khung">
                    <img src="D:\file web image\image.png" class="anh float-start" alt="anh4">
                    <img src="D:\file web image\image.png" class="anh float-end" alt="anh5">
                </div>
                <h5>Center alignment of block-level image using auto margin</h5>
                <div class="khung">
                    <img src="D:\file web image\image.png" class="anh d-block mx-auto" alt="anh6">
                </div>
            </div>
        </main>
        <footer>
            <!-- place footer here -->
        </footer>
        <!-- Bootstrap JavaScript Bundle (includes Popper) -->
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"
        ></script>
    </body>
</html>
