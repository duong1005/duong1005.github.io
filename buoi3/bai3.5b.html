<!doctype html>
<html lang="en" data-bs-theme="light">
    <head>
        <title>Title</title>
        <!-- Required meta tags -->
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- Bootstrap CSS v5.3.8 -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />
    </head>

    <body>
        <header>
            <!-- place navbar here -->
        </header>
        <main>
            <div class="container mt-4">
                <h2>Registration Form</h2>
                <form>
                    <div class="row mb-3 align-items-center">
                        <label
                            for="firstName"
                            class="col-sm-3 col-form-label">
                            First Name:
                        </label>
                        <div class="col-sm-8">
                            <input
                                type="text"
                                class="form-control"
                                id="firstName"
                                placeholder="First Name">
                        </div>
                    </div>
                    <div class="row mb-3 align-items-center">
                        <label
                            for="lastName"
                            class="col-sm-3 col-form-label">
                            Last Name:
                        </label>
                        <div class="col-sm-8">
                            <input
                                type="text"
                                class="form-control"
                                id="lastName"
                                placeholder="Last Name">
                        </div>
                    </div>
                    <div class="row mb-3 align-items-center">
                        <label
                            for="email"
                            class="col-sm-3 col-form-label">
                            Email Address:
                        </label>
                        <div class="col-sm-8">
                            <input
                                type="email"
                                class="form-control"
                                id="email"
                                placeholder="Email Address">
                        </div>
                    </div>
                    <div class="row mb-3 align-items-center">
                        <label
                            for="mobile"
                            class="col-sm-3 col-form-label">
                            Mobile Number:
                        </label>
                        <div class="col-sm-8">
                            <input
                                type="tel"
                                class="form-control"
                                id="mobile"
                                placeholder="Phone Number">
                        </div>
                    </div>
                    <div class="row mb-3 align-items-center">
                        <label class="col-sm-3 col-form-label">
                            Date of Birth:
                        </label>
                        <div class="col-sm-8">
                            <div class="row">
                                <div class="col-md-4">
                                    <select class="form-select">
                                        <option selected>Date</option>
                                        <option>1</option>
                                        <option>2</option>
                                        <option>3</option>
                                        <option>4</option>
                                        <option>5</option>
                                        <option>6</option>
                                        <option>7</option>
                                        <option>8</option>
                                        <option>9</option>
                                        <option>10</option>
                                        <option>11</option>
                                        <option>12</option>
                                        <option>13</option>
                                        <option>14</option>
                                        <option>15</option>
                                        <option>16</option>
                                        <option>17</option>
                                        <option>18</option>
                                        <option>19</option>
                                        <option>20</option>
                                        <option>21</option>
                                        <option>22</option>
                                        <option>23</option>
                                        <option>24</option>
                                        <option>25</option>
                                        <option>26</option>
                                        <option>27</option>
                                        <option>28</option>
                                        <option>29</option>
                                        <option>30</option>
                                        <option>31</option>
                                    </select>
                                </div>
                                <div class="col-md-4">
                                    <select class="form-select">
                                        <option selected>Month</option>
                                        <option>January</option>
                                        <option>February</option>
                                        <option>March</option>
                                        <option>April</option>
                                        <option>May</option>
                                        <option>June</option>
                                        <option>July</option>
                                        <option>August</option>
                                        <option>September</option>
                                        <option>October</option>
                                        <option>November</option>
                                        <option>December</option>
                                    </select>
                                </div>
                                <div class="col-md-4">
                                    <select class="form-select">
                                        <option selected>Year</option>
                                        <option>2000</option>
                                        <option>2001</option>
                                        <option>2002</option>
                                        <option>2003</option>
                                        <option>2004</option>
                                        <option>2005</option>
                                        <option>2006</option>
                                        <option>2007</option>
                                        <option>2008</option>
                                        <option>2009</option>
                                        <option>2010</option>
                                        <option>2011</option>
                                        <option>2012</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="row mb-3">
                        <label
                            for="address"
                            class="col-sm-3 col-form-label">
                            Postal Address:
                        </label>
                        <div class="col-sm-8">
                            <textarea
                                class="form-control"
                                id="address"
                                rows="3"
                                placeholder="Postal Address"></textarea>
                        </div>
                    </div>
                    <div class="row mb-3 align-items-center">
                        <label
                            for="zip"
                            class="col-sm-3 col-form-label">
                            ZIP Code:
                        </label>
                        <div class="col-sm-8">
                            <input
                                type="text"
                                class="form-control"
                                id="zip"
                                placeholder="ZIP Code">
                        </div>
                    </div>
                    <div class="row mb-3 align-items-center">
                        <label
                            for="image"
                            class="col-sm-3 col-form-label">
                            Upload Image:
                        </label>
                        <div class="col-sm-8">
                            <input
                                class="form-control"
                                type="file"
                                id="image">
                        </div>
                    </div>
                    <div class="row mb-3">
                        <label class="col-sm-3 col-form-label">
                            Gender:
                        </label>
                        <div class="col-sm-8">
                            <div class="form-check form-check-inline">
                                <input
                                    class="form-check-input"
                                    type="radio"
                                    name="gender"
                                    id="male"
                                    value="male">
                                <label
                                    class="form-check-label"
                                    for="male">
                                    Male
                                </label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input
                                    class="form-check-input"
                                    type="radio"
                                    name="gender"
                                    id="female"
                                    value="female">
                                <label
                                    class="form-check-label"
                                    for="female">
                                    Female
                                </label>
                            </div>
                        </div>
                    </div>
                    <div class="row mb-3">
                        <div class="offset-sm-3 col-sm-8">
                            <div class="form-check">
                                <input
                                    class="form-check-input"
                                    type="checkbox"
                                    id="terms">
                                <label
                                    class="form-check-label"
                                    for="terms">
                                    I agree to the
                                    <a href="#">
                                        Terms and Conditions
                                    </a>
                                </label>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="offset-sm-3 col-sm-8">
                            <button
                                Type="submit"
                                class="btn btn-primary me-2">
                                Submit
                            </button>
                            <button
                                Type="reset"
                                class="btn btn-primary">
                                Reset
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </main>
        <footer>
            <!-- place footer here -->
        </footer>
        <!-- Bootstrap JavaScript Bundle (includes Popper) -->
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"
        ></script>
    </body>
</html>
